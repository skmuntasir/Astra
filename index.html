<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#03040a" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>ASTRA — one continuous journey</title>
    <meta name="description" content="One unbroken scroll from Earth to the edge of everything." />
    <script>
      // If the app cannot start (an old WebView, no WebGL, ...) show WHY on screen instead of a blank page; it removes itself once the journey is ready.
      (function () {
        var shown = false, last = ''
        function show(msg) {
          if (shown || document.documentElement.dataset.astraReady) return
          shown = true
          var d = document.createElement('div')
          d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;padding:12px 14px;background:#1a0b0b;color:#ffb4b4;font:12px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word'
          d.textContent = 'ASTRA could not start: ' + msg + '\n' + navigator.userAgent
          ;(document.body || document.documentElement).appendChild(d)
        }
        function detail(e) {
          var er = e.error, out = ''
          try {
            if (er === undefined || er === null) out = '\n[no error object]'
            else {
              out = '\n[' + Object.prototype.toString.call(er) + ' name=' + (er.name || '') + ' ctor=' + ((er.constructor && er.constructor.name) || '') + ' message=' + (er.message || '') + ']'
              if (er.stack) out += '\n' + String(er.stack).split('\n').slice(0, 6).join('\n')
            }
            var c = document.createElement('canvas')
            out += '\nwebgl2=' + !!c.getContext('webgl2') + ' mem=' + (navigator.deviceMemory || '?') + ' cores=' + (navigator.hardwareConcurrency || '?')
          } catch (x) { /* diagnostics only */ }
          return out
        }
        window.addEventListener('error', function (e) { show((e.message || 'error') + (e.filename ? ' @ ' + String(e.filename).split('/').pop() + ':' + e.lineno : '') + detail(e)) })
        window.addEventListener('unhandledrejection', function (e) { last = String((e.reason && e.reason.message) || e.reason) })
        setTimeout(function () { if (last) show(last) }, 25000)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
